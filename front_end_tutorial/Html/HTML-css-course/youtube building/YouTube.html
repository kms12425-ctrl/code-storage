<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube.com clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        p {
            font-family: Roboto, Arial;
            margin-top: 0;
            margin-bottom: 0;
        }

        .search-bar {
            font-size: 20px;
            /* margin-left: 100px; */
            display: block;
        }

        .video-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
        }

        .thumbnail-row {
            margin-bottom: 12px;
        }

        .thumbnail {
            width: 300px;
            display: block
        }

        .video-info-grid {
            display: grid;
            grid-template-columns: 50px 1fr;
        }

        .channel-picture {
            background-color: gray;
        }

        .profile-picture {
            width: 40px;
            border-radius: 50px;
        }

        .video-info {
            background-color: gray;
        }


        .video-title {
            margin-top: 0px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            margin-bottom: 12px;

        }

        .video-stats,
        .video-author {
            font-size: 12px;
            color: rgb(96, 96, 96);
        }

        .video-author {
            margin-bottom: 4px;
        }
    </style>
</head>

<body>
    <input class="search-bar" type="text" placeholder="Search">

    <div class="video-preview">

        <div class="thumbnail-row"><img class="thumbnail" src="image/thumbnail-1.webp"></div>
        <div class="video-info-grid">
            <div class="channel-picture"><img class="profile-picture" src="image/channel-1.jpeg"></div>
            <div class="video-info">
                <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
                <p class="video-author">Marques Brownlee </p>
                <p class="video-stats">3.4M views · 6 months ago</p>
            </div>
        </div>
    </div>

    <div class="video-preview">

        <div class="thumbnail-row"><img class="thumbnail" src="image/thumbnail-2.webp"></div>
        <div class="video-info-grid">
            <div class="channel-picture"> <img class="profile-picture" src="image/channel-2.jpeg"></div>
            <div class="video-info">
                <p class="video-title">Try Not To Laugh Challenge #9</p>
                <p class="video-author">Markiplier </p>
                <p class="video-stats">19M views · 4 years ago</p>
            </div>
        </div>

    </div>
</body>

</html>
